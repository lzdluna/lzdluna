name: Validasi data

# Hanya memeriksa. Situs tetap 100% statis dan disajikan GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Validasi data/*.json
        run: npm run validasi

      - name: Periksa konsistensi DESIGN.md
        run: npm run dokumen

      - name: Audit kontras
        run: npm run kontras

      - name: Uji perilaku halaman
        run: npm run uji
